# Configuración del proyecto Supabase de WoodTools.
# Los valores sensibles NO van acá: se cargan con `supabase secrets set`.

project_id = "woodtools-rol-de-visita"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "woodtoolsvisitas://"
additional_redirect_urls = ["woodtoolsvisitas://recuperar"]

# El access token dura una hora; el refresh token mantiene la sesión viva.
# La regla de los 30 días la aplica la app (ver apps/movil/src/nucleo/sesion.ts):
# el "time-box" nativo de Supabase requiere plan Pro.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Nadie se registra solo: las altas las crea un administrador desde el panel.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[functions.transcribir-audio]
verify_jwt = true

[functions.optimizar-ruta]
verify_jwt = true

[functions.geocodificar]
verify_jwt = true

# Maneja datos de todos los vendedores: nunca se expone sin verificar el JWT.
[functions.archivar-historial]
verify_jwt = true

[storage]
enabled = true
file_size_limit = "50MiB"
